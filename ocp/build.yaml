apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: keycloak-kafka-spi
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: keycloak-kafka-spi
spec:
  resources:
    limits:
      cpu: "1"
      memory: "2Gi"
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: "Containerfile"
      imageOptimizationPolicy: "SkipLayers"
  source:
    type: Git
    git:
      uri: 'https://github.com/h3nrique/kafka-keycloak-spi.git'
    contextDir: ''
  runPolicy: Serial
  successfulBuildsHistoryLimit: 5
  failedBuildsHistoryLimit: 5
  triggers:
    - type: ConfigChange
  output:
    to:
      kind: ImageStreamTag
      name: 'keycloak-kafka-spi:latest'
